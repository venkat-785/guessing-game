<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess The Number</title>

    <link rel="stylesheet" href="Game.css">

    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container-fluid bg-container">

        <!-- Top Section -->
        <div class="row bg-white">
            <div class="col-12 m-auto bg-white top-section">

                <img class="guess-game-img" src="images/image1.png">

                <p class="text-center game-description">
                    Find out the right number between 1 to 100
                </p>

            </div>
        </div>

        <!-- Game Section -->
        <div class="row">

            <div class="col-12 guess-bg-container text-center">

                <h1 class="guess-heading">
                    Guess The Number
                    <img class="guess-number-image" src="images/image2.png">
                </h1>

                <input
                    type="text"
                    class="user-input"
                    id="userInput"
                >

                <div>
                    <button
                        class="btn btn-info check-guess"
                        onclick="checkGuess()"
                    >
                        Check
                    </button>
                </div>

                <p class="game-result" id="gameResult"></p>

            </div>

        </div>

    </div>

    <script src="Game.js"></script>

</body>

</html>
